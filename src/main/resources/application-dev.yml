# default application Config!
---
server:
  port: 8081
  servlet:
    context-path: /mosque-donation
---
spring:
  config:
    activate:
      on-profile: local
  servlet:
    multipart:
      enabled: true
      max-file-size: 128MB
      max-request-size: 128MB

  mvc:
    contentnegotiation:
      favor-path-extension: false
      favor-parameter: false
      media-types:
        json: application/json
      default-content-type: application/json

datasource:
